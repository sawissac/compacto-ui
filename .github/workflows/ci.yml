name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The token rules that keep the library on one vocabulary. See
      # scripts/gates.sh for why each one matters.
      - name: Source gates
        run: pnpm gates

      # Runs the directive check, publint and attw as part of the build.
      - name: Build package
        run: pnpm --filter @compacto/ui build

      - name: Test
        run: pnpm --filter @compacto/ui test

      - name: Build docs
        run: pnpm --filter @compacto/docs build
